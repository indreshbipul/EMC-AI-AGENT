<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GameHub - 12 Games</title>
<link rel="stylesheet" href="style.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f23; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; overflow-x: hidden; }

/* Background Effects */
.bg-effects { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.25; animation: float 20s ease-in-out infinite; }
.o1 { width: 500px; height: 500px; background: linear-gradient(135deg, #6366f1, #8b5cf6); top: -150px; left: -150px; }
.o2 { width: 400px; height: 400px; background: linear-gradient(135deg, #ec4899, #f43f5e); bottom: -100px; right: -100px; animation-delay: -5s; }
.o3 { width: 300px; height: 300px; background: linear-gradient(135deg, #10b981, #06b6d4); top: 40%; left: 60%; animation-delay: -10s; }
@keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
}

/* Main Container */
.game-selector { position: relative; z-index: 1; padding: 80px 20px 40px; min-height: 100vh; }
.container { max-width: 1100px; margin: 0 auto; }

/* Header */
.header { text-align: center; margin-bottom: 50px; }
.logo { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 15px; }
.logo-icon { 
    font-size: 50px; 
    animation: bounce 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
.title { 
    font-size: 42px; 
    font-weight: 800; 
    background: linear-gradient(135deg, #6366f1, #ec4899, #6366f1);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradient 3s ease infinite;
}
@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.badge { 
    font-size: 13px; 
    background: linear-gradient(135deg, #f59e0b, #f97316); 
    padding: 5px 12px; 
    border-radius: 20px; 
    margin-left: 12px;
    font-weight: 600;
}
.subtitle { color: #888; font-size: 16px; margin-top: 8px; }

/* Games Grid */
.games-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
    gap: 20px; 
    margin-bottom: 40px; 
}
.game-card { 
    background: linear-gradient(145deg, #1a1a3a, #12122a); 
    border: 2px solid #2a2a5a; 
    border-radius: 20px; 
    padding: 25px 20px; 
    text-align: center; 
    cursor: pointer; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
}
.game-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #6366f1, #ec4899);
    transform: scaleX(0);
    transition: transform 0.3s;
}
.game-card:hover { 
    border-color: #6366f1; 
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
}
.game-card:hover::before { transform: scaleX(1); }
.game-card.active { 
    border-color: #6366f1; 
    background: linear-gradient(145deg, #2a2a5a, #1a1a3a);
    box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
}
.game-card.active::before { transform: scaleX(1); }
.icon { 
    font-size: 45px; 
    margin-bottom: 12px; 
    display: block;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
.game-card h3 { 
    font-size: 15px; 
    margin-bottom: 5px; 
    font-weight: 600;
}
.game-card p { 
    font-size: 11px; 
    color: #666; 
}

/* Start Button */
.start-btn { 
    display: block; 
    width: 240px; 
    margin: 0 auto; 
    padding: 18px 40px; 
    font-size: 20px; 
    font-weight: 700;
    background: linear-gradient(135deg, #6366f1, #ec4899); 
    border: none; 
    border-radius: 50px; 
    color: white; 
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    text-transform: uppercase;
    letter-spacing: 2px;
}
.start-btn:hover { 
    transform: scale(1.05) translateY(-3px);
    box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5);
}

/* Game Container */
.game-container { 
    display: none; 
    padding: 80px 20px 40px; 
    min-height: 100vh;
}
.game-container.active { display: block; }

.game-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    max-width: 900px; 
    margin: 0 auto 25px; 
    flex-wrap: wrap;
    gap: 15px;
}
.back-btn, .settings-btn { 
    background: linear-gradient(145deg, #1a1a3a, #12122a); 
    border: 2px solid #2a2a5a; 
    color: white; 
    padding: 12px 24px; 
    border-radius: 12px; 
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s;
}
.back-btn:hover, .settings-btn:hover { 
    border-color: #6366f1; 
    transform: translateY(-2px);
}
.game-title { 
    font-size: 28px; 
    font-weight: 700;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Stats Bar */
.stats-bar { 
    display: flex; 
    justify-content: center; 
    gap: 20px; 
    margin-bottom: 25px; 
    flex-wrap: wrap; 
}
.stat-box { 
    background: linear-gradient(145deg, #1a1a3a, #12122a); 
    padding: 15px 30px; 
    border-radius: 15px; 
    text-align: center;
    border: 1px solid #2a2a5a;
    min-width: 120px;
}
.stat-label { 
    display: block; 
    font-size: 12px; 
    color: #888; 
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.stat-value { 
    font-size: 28px; 
    font-weight: 800; 
    background: linear-gradient(135deg, #6366f1, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Game Content */
.game-content { 
    max-width: 900px; 
    margin: 0 auto; 
}
.game-board { 
    display: grid; 
    gap: 15px; 
    margin-bottom: 25px; 
    justify-content: center; 
}

/* Canvas */
canvas { 
    display: block; 
    margin: 0 auto; 
    border-radius: 20px; 
    background: #0a0a15;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 100px rgba(99, 102, 241, 0.05);
    border: 2px solid #2a2a5a;
}

/* Controls */
.game-controls { 
    display: flex; 
    justify-content: center; 
    gap: 15px; 
    flex-wrap: wrap; 
    margin-bottom: 25px; 
}
.control-btn { 
    background: linear-gradient(145deg, #1a1a3a, #12122a); 
    border: 2px solid #2a2a5a; 
    color: white; 
    padding: 12px 25px; 
    border-radius: 12px; 
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
}
.control-btn:hover { 
    background: #6366f1; 
    border-color: #6366f1;
    transform: translateY(-2px);
}

/* Memory Cards */
.memory-card { 
    width: 90px; 
    height: 90px; 
    perspective: 1000px; 
    cursor: pointer; 
}
.memory-card > div { 
    position: absolute; 
    width: 100%; 
    height: 100%; 
    backface-visibility: hidden; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    border-radius: 15px; 
    font-size: 36px; 
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
.card-front { 
    background: linear-gradient(135deg, #6366f1, #8b5cf6); 
    transform: rotateY(180deg); 
}
.card-back { 
    background: linear-gradient(145deg, #1a1a3a, #12122a); 
    border: 3px solid #2a2a5a; 
}
.memory-card.flipped .card-front { transform: rotateY(0deg); }
.memory-card.flipped .card-back { transform: rotateY(-180deg); }
.memory-card.matched { 
    opacity: 0.4; 
    pointer-events: none; 
}
.memory-card.matched .card-front {
    background: linear-gradient(135deg, #10b981, #059669);
}

/* Tic Tac Toe */
.ttt-board { 
    display: grid; 
    grid-template-columns: repeat(3, 100px); 
    gap: 8px; 
    margin: 25px auto; 
    width: fit-content; 
    background: #1a1a3a;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.ttt-cell { 
    width: 100px; 
    height: 100px; 
    background: linear-gradient(145deg, #12122a, #0f0f23); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 56px; 
    font-weight: 800; 
    border-radius: 15px; 
    cursor: pointer;
    transition: all 0.3s;
}
.ttt-cell:hover { 
    background: #1a1a3a;
    transform: scale(1.02);
}
.ttt-cell.X { 
    color: #6366f1; 
    text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
}
.ttt-cell.O { 
    color: #ec4899; 
    text-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
}
.ttt-status { 
    text-align: center; 
    margin-bottom: 20px; 
    color: #888; 
    font-size: 18px;
}

/* Chess Board */
.chess-board { 
    display: grid; 
    grid-template-columns: repeat(8, 60px); 
    margin: 25px auto; 
    width: fit-content; 
    border: 5px solid #6366f1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(99, 102, 241, 0.3);
}
.chess-cell { 
    width: 60px; 
    height: 60px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 40px; 
    cursor: pointer;
    transition: all 0.2s;
}
.chess-cell:hover { filter: brightness(1.2); }
.chess-cell.light { background: linear-gradient(135deg, #d4b896, #c4a886); color: #333; }
.chess-cell.dark { background: linear-gradient(135deg, #8b6c53, #7b5c43); color: #333; }
.chess-cell.selected { 
    box-shadow: inset 0 0 0 4px #6366f1;
}

/* Sudoku */
.sudoku-board { 
    display: grid; 
    grid-template-columns: repeat(9, 50px); 
    margin: 25px auto; 
    width: fit-content; 
    border: 4px solid #6366f1;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(99, 102, 241, 0.3);
}
.sudoku-cell { 
    width: 50px; 
    height: 50px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 22px; 
    font-weight: 700; 
    background: #1a1a3a; 
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid #2a2a5a;
}
.sudoku-cell:hover { background: #2a2a5a; }
.sudoku-cell.border-top { border-top: 3px solid #6366f1; }
.sudoku-cell.border-left { border-left: 3px solid #6366f1; }
.sudoku-cell.filled { background: #12122a; }
.sudoku-cell.selected { 
    background: #6366f1 !important;
    color: white;
}
.sudoku-cell.error {
    background: #ef4444 !important;
    color: white;
}
.sudoku-cell.correct {
    background: #10b981 !important;
    color: white;
}

.sudoku-numpad { 
    display: flex; 
    justify-content: center; 
    gap: 10px; 
    margin-bottom: 25px; 
    flex-wrap: wrap; 
}
.numpad-btn { 
    width: 55px; 
    height: 55px; 
    background: linear-gradient(145deg, #1a1a3a, #12122a); 
    border: 2px solid #2a2a5a; 
    color: white; 
    font-size: 22px; 
    font-weight: 700; 
    border-radius: 12px; 
    cursor: pointer;
    transition: all 0.3s;
}
.numpad-btn:hover { 
    background: #6366f1; 
    border-color: #6366f1;
    transform: translateY(-3px);
}

/* Difficulty Selector */
.difficulty-selector, .ttt-mode-selector { 
    display: flex; 
    justify-content: center; 
    gap: 12px; 
    margin-bottom: 25px; 
    flex-wrap: wrap;
}
.diff-btn, .mode-btn { 
    background: linear-gradient(145deg, #1a1a3a, #12122a); 
    border: 2px solid #2a2a5a; 
    color: white; 
    padding: 10px 20px; 
    border-radius: 25px; 
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
}
.diff-btn.active, .mode-btn.active { 
    background: linear-gradient(135deg, #6366f1, #8b5cf6); 
    border-color: #6366f1; 
}

/* Modal */
.modal { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(0, 0, 0, 0.9); 
    display: none; 
    align-items: center; 
    justify-content: center; 
    z-index: 100;
    backdrop-filter: blur(10px);
}
.modal.active { display: flex; }
.modal-content { 
    background: linear-gradient(145deg, #1a1a3a, #12122a); 
    padding: 40px 50px; 
    border-radius: 25px; 
    text-align: center; 
    border: 2px solid #6366f1;
    box-shadow: 0 25px 80px rgba(99, 102, 241, 0.3);
    max-width: 90%;
}
.modal-icon { 
    font-size: 70px; 
    margin-bottom: 20px; 
    animation: bounce 1s ease infinite;
}
.modal-title { 
    font-size: 32px; 
    margin-bottom: 12px; 
    font-weight: 800;
}
.modal-subtitle { 
    color: #888; 
    margin-bottom: 25px; 
    font-size: 16px;
}
.modal-buttons { 
    display: flex; 
    justify-content: center; 
    gap: 20px; 
    flex-wrap: wrap;
}
.modal-btn { 
    padding: 14px 35px; 
    border-radius: 30px; 
    font-size: 16px; 
    font-weight: 700; 
    cursor: pointer; 
    border: none;
    transition: all 0.3s;
}
.modal-btn.primary { 
    background: linear-gradient(135deg, #6366f1, #ec4899); 
    color: white; 
}
.modal-btn.primary:hover { 
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
}
.modal-btn.secondary { 
    background: #2a2a5a; 
    color: white; 
}
.modal-btn.secondary:hover { 
    background: #3a3a6a;
}

/* Player Profile */
.player-profile { 
    position: fixed; 
    top: 20px; 
    left: 20px; 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    background: rgba(26, 26, 58, 0.95); 
    padding: 10px 20px; 
    border-radius: 30px; 
    z-index: 50;
    border: 2px solid #2a2a5a;
    backdrop-filter: blur(10px);
}
.profile-avatar { 
    width: 40px; 
    height: 40px; 
    background: linear-gradient(135deg, #6366f1, #ec4899); 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-weight: 800; 
    font-size: 18px;
}
.profile-info { display: flex; flex-direction: column; }
.profile-name { font-size: 14px; font-weight: 700; }
.profile-level { font-size: 12px; color: #10b981; }
.xp-bar { 
    width: 80px; 
    height: 4px; 
    background: #2a2a5a; 
    border-radius: 2px; 
    margin-top: 3px;
    overflow: hidden;
}
.xp-fill { 
    height: 100%; 
    background: linear-gradient(90deg, #6366f1, #10b981); 
    border-radius: 2px;
    transition: width 0.3s;
}

/* Daily Challenge */
.daily-challenge { 
    position: fixed; 
    top: 20px; 
    right: 20px; 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    background: linear-gradient(135deg, #f59e0b, #f97316); 
    padding: 10px 20px; 
    border-radius: 30px; 
    font-size: 13px; 
    font-weight: 700; 
    z-index: 50;
    cursor: pointer;
    transition: all 0.3s;
}
.daily-challenge:hover { transform: scale(1.05); }

/* Countdown */
.countdown-overlay { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(10, 10, 20, 0.95); 
    display: none; 
    align-items: center; 
    justify-content: center; 
    flex-direction: column; 
    z-index: 200;
}
.countdown-overlay.active { display: flex; }
.count-number { 
    font-size: 150px; 
    font-weight: 900; 
    background: linear-gradient(135deg, #6366f1, #ec4899); 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
    animation: pulse 1s ease infinite;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
.count-text { 
    font-size: 24px; 
    color: #888; 
    letter-spacing: 8px; 
    text-transform: uppercase;
}

/* Achievement Popup */
.achievement-popup {
    position: fixed;
    top: 100px;
    right: 20px;
    background: linear-gradient(145deg, #1a1a3a, #12122a);
    border: 2px solid #f59e0b;
    border-radius: 15px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 300;
    transform: translateX(120%);
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 15px 40px rgba(245, 158, 11, 0.3);
}
.achievement-popup.show { transform: translateX(0); }
.achievement-icon { font-size: 40px; }
.achievement-text { text-align: left; }
.achievement-title { font-size: 12px; color: #f59e0b; text-transform: uppercase; letter-spacing: 1px; }
.achievement-name { font-size: 16px; font-weight: 700; }
.achievement-desc { font-size: 12px; color: #888; }
.achievement-xp { font-size: 14px; color: #10b981; font-weight: 700; }

/* Final Stats */
.final-stats { 
    display: flex; 
    justify-content: center; 
    gap: 20px; 
    margin-bottom: 25px; 
    flex-wrap: wrap; 
}
.final-stat { 
    background: #2a2a5a; 
    padding: 15px 25px; 
    border-radius: 12px; 
    min-width: 120px;
}
.final-stat-label { 
    display: block; 
    font-size: 12px; 
    color: #888; 
    margin-bottom: 5px;
}
.final-stat-value { 
    font-size: 28px; 
    font-weight: 800; 
    color: #6366f1; 
}
.new-best { 
    background: linear-gradient(135deg, #f59e0b, #f97316); 
    color: white; 
    padding: 10px 20px; 
    border-radius: 25px; 
    font-weight: 700; 
    margin-bottom: 20px;
    display: inline-block;
}

/* Game Hint */
.game-hint { 
    text-align: center; 
    color: #555; 
    font-size: 14px; 
    margin-top: 15px;
}

/* Settings */
.setting-item { 
    display: flex; 
    justify-content: space-between; 
    padding: 15px 0; 
    border-bottom: 1px solid #2a2a5a; 
}
.toggle-switch { 
    position: relative; 
    width: 50px; 
    height: 26px; 
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { 
    position: absolute; 
    cursor: pointer; 
    top: 0; 
    left: 0; 
    right: 0; 
    bottom: 0; 
    background: #2a2a5a; 
    border-radius: 25px; 
    transition: 0.3s; 
}
.toggle-slider::before { 
    position: absolute; 
    content: ""; 
    height: 20px; 
    width: 20px; 
    left: 3px; 
    bottom: 3px; 
    background: white; 
    border-radius: 50%; 
    transition: 0.3s; 
}
.toggle-switch input:checked + .toggle-slider { background: #6366f1; }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(24px); }

/* Responsive */
@media (max-width: 700px) {
    .games-grid { grid-template-columns: repeat(3, 1fr); }
    .game-card { padding: 15px 10px; }
    .icon { font-size: 32px; }
    .game-card h3 { font-size: 12px; }
    .title { font-size: 28px; }
    .chess-board { grid-template-columns: repeat(8, 40px); }
    .chess-cell { width: 40px; height: 40px; font-size: 26px; }
    .sudoku-board { grid-template-columns: repeat(9, 36px); }
    .sudoku-cell { width: 36px; height: 36px; font-size: 16px; }
    .ttt-board { grid-template-columns: repeat(3, 80px); }
    .ttt-cell { width: 80px; height: 80px; font-size: 40px; }
    .memory-card { width: 70px; height: 70px; }
    .memory-card > div { font-size: 28px; }
}
</style>
</head>
<body>

<!-- Background Effects -->
<div class="bg-effects">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
</div>

<!-- Player Profile -->
<div class="player-profile" id="playerProfile">
    <div class="profile-avatar">P</div>
    <div class="profile-info">
        <span class="profile-name">Player</span>
        <span class="profile-level">Level 1</span>
        <div class="xp-bar"><div class="xp-fill" style="width: 0%"></div></div>
    </div>
</div>

<!-- Daily Challenge -->
<div class="daily-challenge" onclick="showDailyChallenge()">
    <span>🎯</span>
    <span>Daily Challenge</span>
</div>

<!-- MENU -->
<div class="game-selector" id="menu">
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">🎮</span>
                <span class="title">GameHub</span>
                <span class="badge">12 GAMES</span>
            </div>
            <p class="subtitle">Select a game and challenge yourself!</p>
        </div>
        
        <div class="games-grid" id="gamesGrid">
            <!-- Games will be populated by JS -->
        </div>
        
        <button class="start-btn" onclick="startGame()">Start Game</button>
    </div>
</div>

<!-- GAME AREA -->
<div class="game-container" id="gameArea">
    <div class="game-header">
        <button class="back-btn" onclick="showMenu()">← Back to Menu</button>
        <h2 class="game-title" id="gameTitle"></h2>
        <button class="settings-btn" onclick="showSettings()">⚙️ Settings</button>
    </div>
    
    <div class="stats-bar">
        <div class="stat-box">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-box" id="extraStats" style="display: none;">
            <span class="stat-label" id="extraStatLabel">Time</span>
            <span class="stat-value" id="extraStatValue">0</span>
        </div>
    </div>
    
    <div class="game-content">
        <div class="difficulty-selector" id="difficultySelector" style="display: none;">
            <button class="diff-btn active" onclick="setDifficulty('easy')">Easy</button>
            <button class="diff-btn" onclick="setDifficulty('medium')">Medium</button>
            <button class="diff-btn" onclick="setDifficulty('hard')">Hard</button>
        </div>
        
        <div class="ttt-mode-selector" id="tttModeSelector" style="display: none;">
            <button class="mode-btn active" onclick="setTTTMode('pvp')">vs Player</button>
            <button class="mode-btn" onclick="setTTTMode('ai')">vs AI</button>
        </div>
        
        <div class="game-board" id="gameBoard">
            <canvas id="gameCanvas" width="600" height="450"></canvas>
        </div>
        
        <div class="game-controls" id="gameControls">
            <!-- Controls will be added dynamically -->
        </div>
        
        <p class="game-hint" id="instructions">Use arrow keys to play</p>
    </div>
</div>

<!-- WIN MODAL -->
<div class="modal" id="winModal">
    <div class="modal-content">
        <div class="modal-icon">🏆</div>
        <h2 class="modal-title" id="winTitle">You Win!</h2>
        <p class="modal-subtitle" id="winSubtitle">Great job!</p>
        <div class="final-stats" id="finalStats"></div>
        <div class="new-best" id="newBest" style="display: none;">🎉 New Best!</div>
        <div class="modal-buttons">
            <button class="modal-btn primary" onclick="restartGame()">Play Again</button>
            <button class="modal-btn secondary" onclick="showMenu()">Main Menu</button>
        </div>
    </div>
</div>

<!-- PAUSE MODAL -->
<div class="modal" id="pauseModal">
    <div class="modal-content">
        <div class="modal-icon">⏸️</div>
        <h2 class="modal-title">Game Paused</h2>
        <p class="modal-subtitle">Take a break!</p>
        <div class="modal-buttons">
            <button class="modal-btn primary" onclick="resumeGame()">Resume</button>
            <button class="modal-btn secondary" onclick="showMenu()">Main Menu</button>
        </div>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <div class="modal-icon">⚙️</div>
        <h2 class="modal-title">Settings</h2>
        <div class="setting-item">
            <span>Sound Effects</span>
            <label class="toggle-switch">
                <input type="checkbox" id="soundToggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <span>Timer</span>
            <label class="toggle-switch">
                <input type="checkbox" id="timerToggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <span>Hints</span>
            <label class="toggle-switch">
                <input type="checkbox" id="hintsToggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="modal-buttons" style="margin-top: 25px;">
            <button class="modal-btn primary" onclick="closeSettings()">Done</button>
        </div>
    </div>
</div>

<!-- COUNTDOWN -->
<div class="countdown-overlay" id="countdown">
    <div class="count-number" id="countNumber">3</div>
    <div class="count-text">GET READY</div>
</div>

<script src="script.js"></script>
</body>
</html>
